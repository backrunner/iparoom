name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm build:cli
      - name: Use reachable Ubuntu HTTPS mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm pack:cli
      - name: Verify packaged CLI outside the repository
        run: |
          npm install --prefix "$RUNNER_TEMP/iparoom-package" "$GITHUB_WORKSPACE/dist/iparoom-cli-0.1.0.tgz"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/iparoom-package/node_modules/.bin/iparoom" --version
          "$RUNNER_TEMP/iparoom-package/node_modules/.bin/iparoom" skill install --path "$RUNNER_TEMP/skills" --json
          npm audit --prefix "$RUNNER_TEMP/iparoom-package" --omit=dev
      - name: Verify packaged MCP tools and IPA delivery
        env:
          IPAROOM_TEST_MCP_BIN: ${{ runner.temp }}/iparoom-package/node_modules/iparoom-cli/bin/iparoom-mcp.mjs
        run: pnpm exec playwright test tests/e2e/mcp.spec.ts
